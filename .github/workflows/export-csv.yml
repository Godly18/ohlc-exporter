# Does ALL the heavy work for the web app, so the Render server's outbound bandwidth is not used for it:
#   mode=export       retrieves the data from the provider (OANDA / Binance / Twelve Data) into Cloudflare R2 when it
#                     is not stored yet, builds the CSV (+ missing-data report) and publishes it as a workflow
#                     artifact, which the user's browser downloads through the app's redirect.
#   mode=maintenance  the hourly catch-up of already stored datasets.
# The web app triggers it (workflow_dispatch), keeps the global lock, shows the progress this run writes to the
# database, and can cancel it (the "Cancel" button cancels this run).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DATABASE_URL        the SAME Postgres connection string the web app uses (external URL)
#   DATABASE_SSL        optional, same value as on the web app (e.g. "true")
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME   (token needs READ + WRITE)
#   OANDA_API_TOKEN     forex pairs   (OANDA_ENVIRONMENT as a repository variable if not "practice")
#   TWELVEDATA_API_KEY  XAU/USD
# Optional repository variable: EXTRA_CLOSED_DATES.  Binance needs no key.

name: Export CSV
run-name: export ${{ inputs.export_id }}

on:
  workflow_dispatch:
    inputs:
      export_id:
        description: Export id (used to find this run)
        required: true
        type: string
      mode:
        description: export or maintenance
        required: false
        default: export
        type: string
      job_id:
        required: false
        type: string
      instrument:
        required: false
        type: string
      timeframe:
        required: false
        type: string
      start_date:
        required: false
        type: string
      end_date:
        required: false
        type: string
      last_day:
        description: Last completed UTC day the web app allows
        required: false
        type: string
      artifact_name:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: oanda-export # the web app already allows one job at a time; this is a safety net
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Retrieve data and build the CSV
        env:
          # Inputs are passed as environment variables, never interpolated into the script.
          JOB_MODE: ${{ inputs.mode }}
          EXPORT_ID: ${{ inputs.export_id }}
          JOB_ID: ${{ inputs.job_id }}
          INSTRUMENT: ${{ inputs.instrument }}
          TIMEFRAME: ${{ inputs.timeframe }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          LAST_DAY: ${{ inputs.last_day }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          OANDA_ENVIRONMENT: ${{ vars.OANDA_ENVIRONMENT }}   # optional repository variable
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          EXTRA_CLOSED_DATES: ${{ vars.EXTRA_CLOSED_DATES }}   # optional repository variable
        run: node scripts/workflow-job.js

      # GitHub always delivers an artifact as a .zip: the CSV (and the missing-data report, when there is one)
      # are compressed into it by GitHub.
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode != 'maintenance' }}
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            out/*.csv
            out/*.txt
          retention-days: 1          # the app deletes it after 5 minutes; this is only the safety net
          compression-level: 9
          if-no-files-found: error
