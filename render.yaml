# Render Blueprint: free web service + free Postgres.
# Secrets marked `sync: false` are entered once in the Render dashboard.
services:
  - type: web
    name: oanda-ohlc-exporter
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: node backend/server.js
    # Liveness only: never touches the database, R2, OANDA or the job lock.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oanda-ohlc-db
          property: connectionString
      - key: EXPORT_TOKEN_SECRET
        generateValue: true
      - key: OANDA_API_TOKEN
        sync: false
      - key: OANDA_ENVIRONMENT
        value: practice
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

databases:
  - name: oanda-ohlc-db
    plan: free
    region: oregon
